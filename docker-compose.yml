services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  app:
    build: .
    env_file: .env
    environment: ["QDRANT_URL=http://qdrant:6333"]
    ports: ["8501:8501"]
    depends_on: [qdrant]
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: ["QDRANT_URL=http://qdrant:6333"]
    ports: ["8000:8000"]
    depends_on: [qdrant]
volumes:
  qdrant_data:
